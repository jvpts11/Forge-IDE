<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Forge app icon: a steel hammer striking a steel anvil on the dark brand ground. The metal is
       iron/steel (cool grays); the LDP3 amber is concentrated in the forge spark and a faint heat
       glow, so the brand reads as a warm accent rather than flooding the mark. -->
  <defs>
    <radialGradient id="heat" cx="42%" cy="60%" r="42%">
      <stop offset="0%" stop-color="#eab464" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#e08a3c" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#eab464" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="anvil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d3dbe4"/>
      <stop offset="55%" stop-color="#9aa4b1"/>
      <stop offset="100%" stop-color="#727c8a"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e3e9ef"/>
      <stop offset="100%" stop-color="#8b95a2"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a9743a"/>
      <stop offset="100%" stop-color="#7c5127"/>
    </linearGradient>
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4de"/>
      <stop offset="45%" stop-color="#ffd9a0"/>
      <stop offset="100%" stop-color="#f0a24a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="#101c1f"/>
  <ellipse cx="108" cy="150" rx="104" ry="80" fill="url(#heat)"/>

  <!-- Anvil: top face with a horn on the left, over a narrow-waisted flared base. -->
  <g fill="url(#anvil)">
    <path d="M34 150 L64 132 L206 132 L206 160 L64 160 Z"/>
    <path d="M86 160 L184 160 L150 186 L190 205 L190 214 L70 214 L70 205 L110 186 Z"/>
  </g>
  <!-- a warm sheen along the struck face -->
  <rect x="64" y="132" width="142" height="3" rx="1.5" fill="#ffd9a0" opacity="0.45"/>

  <!-- Hammer, angled to strike the anvil's top face: steel head, wooden handle. -->
  <g transform="rotate(-20 120 104)">
    <rect x="150" y="97" width="94" height="14" rx="7" fill="url(#handle)"/>
    <rect x="86" y="82" width="70" height="44" rx="11" fill="url(#head)"/>
    <rect x="86" y="82" width="16" height="44" rx="7" fill="#6f7986"/>
  </g>

  <!-- Spark where the hammer meets the anvil: the amber hero of the mark. -->
  <circle cx="104" cy="120" r="17" fill="url(#spark)" opacity="0.9"/>
  <g fill="#fff1d6">
    <path d="M104 120 l4 -15 l4 15 l15 4 l-15 4 l-4 15 l-4 -15 l-15 -4 z"/>
    <circle cx="134" cy="110" r="3"/>
    <circle cx="90" cy="130" r="2.4"/>
    <circle cx="120" cy="134" r="2"/>
  </g>
</svg>
