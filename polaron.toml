[polaron_project]

[program]
name = "Forge"
version = "0.3.0"
language_version = "1.0"
entry = "src/main.pol"

# The OpenGL binding is installed by the toolchain (`polaron plug`), which writes the dependency
# below; nothing here names opengl32, gdi32, user32, kernel32 or gdiplus, because that library's own
# manifest maps each name to a file per platform and the mapping travels inside its .polb.
#
# `native_libs` still carries the three that are OURS -- the clipboard, the folder picker, the save
# dialog. Those live in `src/ffi`, whose classes name no library of their own yet; giving each one a
# `library` clause means splitting the two classes that reach into more than one (ClipWin32 spans
# user32 and kernel32, Win32 spans user32, kernel32 and the CRT), which is a change to make on
# purpose rather than in passing.

[build]
output = "build-output/"
target = "x86_64-windows"
freestanding = false
subsystem = "windows"   # GUI app: no console window on launch
native_libs = "shell32, ole32, comdlg32"

[dependencies]
Polaron-OpenGL = { path = "libraries/Polaron-OpenGL", source = "https://github.com/jvpts11/Polaron-OpenGL@^1.0.0" }
